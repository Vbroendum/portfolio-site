# The quality gate. Runs on every pull request, and is called by deploy.yml
# before anything is built or shipped, so main can only deploy when green.
name: checks

on:
  pull_request:
  workflow_call: # deploy.yml calls this
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
        env:
          # The build only needs these to be set, not correct: it runs without
          # an API and falls back to empty content. The real values are baked
          # in by the image build in deploy.yml.
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  images:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. `npm run build` passing is not the same as the
      # image building: the image has its own context, and a file missing from
      # git (an empty directory, say) only shows up here.
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: portfolio-site-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Run it and wait for the image's own healthcheck to pass. Building is
      # not enough: the container once started cleanly but bound to the wrong
      # address, so nothing inside it could reach itself and Swarm killed it.
      # No API is running here, which is the point - the health route must not
      # depend on one.
      - name: web container becomes healthy
        run: |
          docker run -d --name web-ci portfolio-site-web:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web-ci 2>/dev/null || echo missing)
            echo "attempt $i: $status"
            case "$status" in
              healthy) echo "container reports healthy"; docker rm -f web-ci >/dev/null; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 3
          done
          echo "::error::web container never became healthy"
          docker inspect -f '{{json .State.Health}}' web-ci || true
          docker logs web-ci || true
          docker rm -f web-ci >/dev/null || true
          exit 1

  stack:
    name: stack file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker-stack.yml parses
        run: |
          # Catch YAML and interpolation mistakes here rather than on the
          # server mid-deploy.
          set -a
          . ./.env.example
          IMAGE_TAG=ci
          SITE_HOST=example.com
          API_HOST=api.example.com
          set +a
          docker compose -f docker-stack.yml config >/dev/null
          echo "docker-stack.yml is valid"
