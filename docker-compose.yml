# Local and single-VPS deployment.
#
#   cp .env.example .env     # then edit the secrets
#   docker compose up -d --build
#   docker compose exec api adminctl create-user -email you@example.com
#
# Nothing but the web and api ports are published; Postgres stays on the
# internal network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL: ${SESSION_TTL:-168h}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}/media
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./web
      args:
        # Baked into the browser bundle, so they are build args, not env vars.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-side calls go over the compose network, not the public URL.
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
